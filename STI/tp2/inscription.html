<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mesStyles.css">
    <title>Document</title>
</head>
<body onload="genererCaptch()">
    <form action="">
        <fieldset>
            <h1>Formulaire d'inscription</h1>
            <table>
                <tr>
                    <td><label for="">Identifiant Eleve</label></td>
                    <td><input type="text" name="" id="" placeholder="votre numero personnel de 16 chiffres"></td>
                </tr>
                <tr>
                    <td><label for="">Numero Telephonique</label></td>
                    <td><input type="tel" name="" id="" placeholder="ex: 98 123 456 (xx xxx xxx)"></td>
                </tr>
                <tr>
                    <td><label for="">Operateur</label></td>
                    <td><input type="text" name="" id="" list="l">
                    <datalist id="l">
                        <option value="orange"></option>
                        <option value="ooredoo"></option>
                        <option value="telecom"></option>
                    </datalist></td>
                </tr>
                <tr>
                    <td><label for="">age</label></td>
                    <td><input type="range" name="" id="" min="1" max="100"><output id="jeune candidats"></output></td>
                </tr>
                <tr>
                    <td><button type="submit">Genere captcha</button></td>
                    <td><output id="captcha"></output></td>
                </tr>
                <tr>
                    <td><label for="">retaper captcha</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><button type="submit">S'inscrire</button></td>
                    <td><button type="reset">Annuler</button></td>
                </tr>
            </table>
        </fieldset>
    </form>
</body>
</html>
