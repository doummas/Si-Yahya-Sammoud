<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mesStyles.css">
    <script src="controles.js"></script>
    <title>Document</title>
</head>
<body onload="genererCaptch();temps()" >
    <form action="#" onsubmit="return verifInscrit()">
        <fieldset>
            <h1>Formulaire d'inscription</h1>
            <table>
                <tr>
                    <td><label for="">Identifiant Eleve</label></td>
                    <td><input type="text" name="" id="cin" placeholder="votre numero personnel de 16 chiffres"></td>
                </tr>
                <tr>
                    <td><label for="">Numero Telephonique</label></td>
                    <td><input type="tel" name="" id="tel" placeholder="ex: 98 123 456 (xx xxx xxx)"></td>
                </tr>
                <tr>
                    <td><label for="">Operateur</label></td>
                    <td><input type="text" name="" id="ope" list="l">
                    <datalist id="l">
                        <option value="orange"></option>
                        <option value="ooredoo"></option>
                        <option value="telecom"></option>
                    </datalist></td>
                </tr>
                <tr>
                    <td><label for="">age</label></td>
                    <td><input type="range" name="" id="age" min="1" max="100" onchange="change()"><output id="jeune candidats"></output></td>
                    <td><output id="outt"></output></td>
                </tr>
                <tr>
                    <td><button type="submit">Genere captcha</button></td>
                    <td><output id="captcha"></output></td>
                </tr>
                <tr>
                    <td><label for="">retaper captcha</label></td>
                    <td><input type="text" id="rep"></td>
                </tr>
                <tr>
                    <td><button type="submit">S'inscrire</button></td>
                    <td><button type="reset">Annuler</button></td>
                </tr>
            </table>
        </fieldset>
    </form>
</body>
</html>
